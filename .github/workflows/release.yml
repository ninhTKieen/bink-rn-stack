name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use an npm with trusted publishing support
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          NAME="$(jq -r .name package.json)"
          VERSION="$(jq -r .version package.json)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$NAME@$VERSION" version --silent > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm — skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is new — publishing."
          fi

      - name: Build
        if: steps.version.outputs.published == 'false'
        run: yarn build

      - name: Smoke-test the package tarball
        if: steps.version.outputs.published == 'false'
        run: |
          TARBALL="$(npm pack --silent)"
          # The CLI resolves templates/ relative to dist/, so a packaging mistake
          # only shows up once the tarball is installed somewhere else.
          tar -tzf "$TARBALL" | grep -q '^package/templates/' \
            || { echo "templates/ is missing from the tarball"; exit 1; }

          SMOKE="$(mktemp -d)"
          npm install --prefix "$SMOKE" --no-save "$PWD/$TARBALL"
          "$SMOKE/node_modules/.bin/bink-rn-stack" --version
          "$SMOKE/node_modules/.bin/bink-rn-stack" --help
          rm -f "$TARBALL"

      # Authenticates through OIDC against the trusted publisher configured on
      # npmjs.com, so no token is involved and npm's 2FA requirement is met.
      # Provenance is attested automatically here.
      - name: Publish
        if: steps.version.outputs.published == 'false'
        run: npm publish --access public

      - name: Tag the release
        if: steps.version.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PKG: ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Published \`$PKG\` to npm." \
            --generate-notes
